name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned command line tools: platform 37 ships as a minor-versioned package
  # ("platforms;android-37.0") which older sdkmanager builds do not understand.
  CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          # `pipefail` is deliberately off: the `yes` commands below get a broken
          # pipe (and a non-zero status) as soon as sdkmanager exits.
          set -eu
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip "$CMDLINE_TOOLS_URL"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          yes | "$SDKM" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: workly-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workly-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Release signing is intentionally NOT enabled by default.
  #
  # Workly is a public repository: no keystore, password or token is ever
  # committed. When you are ready to publish signed releases, add these
  # repository secrets (Settings -> Secrets and variables -> Actions):
  #
  #   WORKLY_KEYSTORE_BASE64  base64 of your .jks file  (base64 -w0 release.jks)
  #   WORKLY_KEYSTORE_PASSWORD
  #   WORKLY_KEY_ALIAS
  #   WORKLY_KEY_PASSWORD
  #
  # ...then create `keystore.properties` from those secrets and run
  # `./gradlew assembleRelease` in a job like the (commented) one below.
  #
  # release:
  #   name: Signed release APK
  #   runs-on: ubuntu-latest
  #   if: startsWith(github.ref, 'refs/tags/v')
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: actions/setup-java@v5
  #       with: { distribution: temurin, java-version: '21' }
  #     - run: ./gradlew assembleRelease
  #     - run: echo "${{ secrets.WORKLY_KEYSTORE_BASE64 }}" | base64 -d > release.jks
  #     - name: Write signing config
  #       run: |
  #         cat > keystore.properties <<EOF
  #         storeFile=../release.jks
  #         storePassword=${{ secrets.WORKLY_KEYSTORE_PASSWORD }}
  #         keyAlias=${{ secrets.WORKLY_KEY_ALIAS }}
  #         keyPassword=${{ secrets.WORKLY_KEY_PASSWORD }}
  #         EOF
  # ---------------------------------------------------------------------------
