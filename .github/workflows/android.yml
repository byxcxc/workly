name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        # compileSdk 37 lives in a minor-versioned platform directory.
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
          sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: workly-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workly-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Release signing is intentionally NOT enabled by default.
  #
  # Workly is a public repository: no keystore, password or token is ever
  # committed. When you are ready to publish signed releases, add these
  # repository secrets (Settings -> Secrets and variables -> Actions):
  #
  #   WORKLY_KEYSTORE_BASE64  base64 of your .jks file  (base64 -w0 release.jks)
  #   WORKLY_KEYSTORE_PASSWORD
  #   WORKLY_KEY_ALIAS
  #   WORKLY_KEY_PASSWORD
  #
  # ...then create `keystore.properties` from those secrets and run
  # `./gradlew assembleRelease` in a job like the (commented) one below.
  #
  # release:
  #   name: Signed release APK
