name: Instrumented tests

# These tests drive the real app on an emulator: the Room database, the
# repository rules and the Compose UI flows (start work, finish work, add,
# edit, delete and navigation).
#
# They run on demand because a virtual device takes several minutes to boot.
# The main `Android CI` workflow always builds the app and runs the JVM tests.

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 03:00 UTC, so a regression cannot hide for long.
    - cron: '0 3 * * 1'

permissions:
  contents: read

env:
  CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-tests:
    name: Instrumented tests on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          # `pipefail` is deliberately off: the `yes` commands below get a broken
          # pipe (and a non-zero status) as soon as sdkmanager exits.
          set -eu
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip "$CMDLINE_TOOLS_URL"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          yes | "$SDKM" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Show test results
        if: always()
        run: |
          # Printing the JUnit XML keeps the failure reason in the CI log itself.
          find app/build/outputs/androidTest-results -name "*.xml" -print -exec head -c 6000 {} \; || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workly-instrumented-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 14
